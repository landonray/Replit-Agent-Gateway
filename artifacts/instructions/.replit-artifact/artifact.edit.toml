kind = "web"
previewPath = "/"
title = "Agent Gateway Instructions"
version = "1.0.0"
id = "artifacts/instructions"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23093

[services.development]
run = "pnpm --filter @workspace/instructions run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/instructions", "run", "build" ]
publicDir = "artifacts/instructions/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23093"
BASE_PATH = "/"
